# drelay release information.
#
# This file is the single source of truth for the version string, both for the
# build (build.ps1 / the release workflow read it) and at runtime (Launcher reads
# it from the jar to answer "is there a newer release?").
#
# Keep the value a semantic version: <major>.<minor>.<patch>, optionally with a prerelease
# suffix such as -alpha. The release workflow tags it as v<version> and refuses to publish while
# pom.xml disagrees, so bump both together - tools/Bump-Version.ps1 does exactly that.
#
# A prerelease suffix is published as a GitHub prerelease, but the updater does not filter on that
# flag: it treats any non-draft release newer than this build as an update. See Updater.check.
version=0.0.2-alpha
# GitHub repository that publishes releases, as owner/name.
repository=is-fo/drelay
